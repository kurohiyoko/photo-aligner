<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顔サイズそろえツール｜波鍼灸院</title>
<style>
:root {
  --bg: #f7f4e9;
  --surface: #faf8f0;
  --surface2: #efe6e0;
  --border: rgba(181,135,106,0.2);
  --accent: #7d95a3;
  --accent-rgb: 125,149,163;
  --accent2: #b98a92;
  --warn: #c99a63;
  --danger: #c17f8a;
  --text: #4a3f3c;
  --text2: #8c7f79;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
}
header .logo { font-size: 15px; font-weight: 700; }
header .logo span { font-size: 12px; font-weight: 400; color: var(--text2); }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px; }

.intro {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 12px;
  line-height: 1.8;
  color: var(--text2);
  margin-bottom: 16px;
}
.intro b { color: var(--text); }

.upload-box {
  background: var(--surface);
  border: 2px dashed rgba(var(--accent-rgb),0.4);
  border-radius: 12px;
  padding: 30px 16px;
  text-align: center;
  margin-bottom: 16px;
}
.upload-box input[type="file"] { display: none; }
.upload-label {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  padding: 12px 28px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.upload-hint { font-size: 11px; color: var(--text2); margin-top: 10px; line-height: 1.7; }

.status-line { font-size: 12px; color: var(--text2); margin-bottom: 10px; display: none; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.photo-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  text-align: center;
}
.photo-card canvas, .photo-card img { width: 100%; display: block; background: var(--surface2); aspect-ratio: 3/4; object-fit: cover; }
.photo-card .cap { font-size: 10px; padding: 5px; color: var(--text2); }
.photo-card .cap.err { color: var(--danger); }

.action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.action-btn {
  flex: 1;
  min-width: 140px;
  background: rgba(var(--accent-rgb),0.15);
  border: 1px solid rgba(var(--accent-rgb),0.4);
  color: var(--accent);
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.btn-glasses-yes, .btn-glasses-no {
  font-size: 18px;
  padding: 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  width: 100%;
}
.btn-glasses-yes { background: var(--accent); color: #fff; }
.btn-glasses-no { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

/* ===== 見やすいモード（メガネを外す方向け） ===== */
body.large-mode .upload-label {
  font-size: 20px !important;
  padding: 20px 36px !important;
}
body.large-mode .upload-hint { font-size: 14px !important; }
body.large-mode .intro { display: none !important; }
body.large-mode .action-btn { font-size: 18px !important; padding: 20px !important; }
body.large-mode .photo-card .cap { font-size: 13px !important; }
body.large-mode .pc-suggest {
  display: block !important;
  background: rgba(var(--accent-rgb),0.15);
  border: 2px solid var(--accent);
  border-radius: 10px;
  padding: 16px;
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 16px;
}
.pc-suggest { display: none; }
.action-btn:disabled { opacity: 0.4; cursor: default; }
.action-btn.primary { background: var(--accent); color: #fff; border: none; }

.compare-preview { margin-top: 10px; }
.compare-preview canvas { width: 100%; border-radius: 8px; border: 1px solid var(--border); }

footer { text-align: center; font-size: 10px; color: var(--text2); padding: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo">顔サイズそろえツール <span>｜ 波鍼灸院</span></div>
</header>

<div class="wrap">
  <div id="glassesPrompt">
    <h2 style="font-size:18px;margin-bottom:10px;">メガネを外しますか？</h2>
    <p style="font-size:12px;color:var(--text2);margin-bottom:20px;">外す方は、ボタンや文字を大きくした<br>見やすい画面に切り替えます。</p>
    <div style="display:flex; flex-direction:column; gap:12px; max-width:280px; margin:0 auto;">
      <button class="btn-glasses-yes" id="btnGlassesYes">はい（外します）</button>
      <button class="btn-glasses-no" id="btnGlassesNo">いいえ（そのまま）</button>
    </div>
  </div>

  <div id="mainScreen" style="display:none">
    <div class="pc-suggest">📺 写真の確認・比較は、画面の大きいパソコンで行うとさらに見やすいです。</div>
    <div class="intro">
      <b>写真ごとに顔の大きさ・向きがバラバラでも、目の位置を基準に自動でそろえます。</b><br>
      処理はすべてこの端末内で行われます。写真はどこにも送信・保存されません。<br>
      「顎運動セルフチェック」アプリで保存した写真も、そのままアップロードして使えます。
    </div>

    <div class="upload-box">
      <label class="upload-label" for="fileInput">📷 写真を選ぶ（複数可）</label>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="upload-hint">スマホの写真フォルダから、比べたい写真を選んでください。<br>正面を向いた写真ほど、きれいにそろいます。</div>
    </div>

    <div class="status-line" id="statusLine">処理中...</div>
    <div class="grid" id="resultGrid"></div>

    <div class="action-row" id="actionRow" style="display:none">
      <button class="action-btn" id="btnDownloadEach">1枚ずつ保存</button>
      <button class="action-btn primary" id="btnMakeCompare">並べた比較画像を作る</button>
    </div>

    <div class="compare-preview" id="comparePreview"></div>
  </div>
</div>

<footer>波鍼灸院｜顔サイズそろえツール</footer>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
// 目の基準点（468点FaceMeshの標準インデックス。虹彩refineは不要）
const LEFT_EYE_OUTER = 33, LEFT_EYE_INNER = 133;
const RIGHT_EYE_INNER = 362, RIGHT_EYE_OUTER = 263;

// 出力キャンバスの規格（すべてこのサイズ・この目の位置に揃える）
const OUT_W = 360, OUT_H = 480;
const TARGET_LEFT_EYE = { x: OUT_W * 0.38, y: OUT_H * 0.42 };
const TARGET_RIGHT_EYE = { x: OUT_W * 0.62, y: OUT_H * 0.42 };
const TARGET_DIST = Math.hypot(TARGET_RIGHT_EYE.x - TARGET_LEFT_EYE.x, TARGET_RIGHT_EYE.y - TARGET_LEFT_EYE.y);

let faceMesh = null;
let alignedResults = []; // { canvas, name } の配列

function initFaceMesh() {
  faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });
  faceMesh.setOptions({
    staticImageMode: true,
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.5,
  });
}
initFaceMesh();

document.getElementById('btnGlassesYes').addEventListener('click', () => {
  document.body.classList.add('large-mode');
  document.getElementById('glassesPrompt').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
});
document.getElementById('btnGlassesNo').addEventListener('click', () => {
  document.getElementById('glassesPrompt').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
});

function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function detectFace(img) {
  return new Promise((resolve) => {
    let done = false;
    faceMesh.onResults((results) => {
      if (done) return;
      done = true;
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        resolve(results.multiFaceLandmarks[0]);
      } else {
        resolve(null);
      }
    });
    faceMesh.send({ image: img });
  });
}

// 目の位置をもとに、回転・拡大縮小・平行移動をして正規化キャンバスに描画
function alignImage(img, landmarks) {
  const lEyeOuter = landmarks[LEFT_EYE_OUTER];
  const lEyeInner = landmarks[LEFT_EYE_INNER];
  const rEyeInner = landmarks[RIGHT_EYE_INNER];
  const rEyeOuter = landmarks[RIGHT_EYE_OUTER];

  const leftEye = {
    x: ((lEyeOuter.x + lEyeInner.x) / 2) * img.naturalWidth,
    y: ((lEyeOuter.y + lEyeInner.y) / 2) * img.naturalHeight,
  };
  const rightEye = {
    x: ((rEyeInner.x + rEyeOuter.x) / 2) * img.naturalWidth,
    y: ((rEyeInner.y + rEyeOuter.y) / 2) * img.naturalHeight,
  };

  const srcDist = Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y);
  const scale = TARGET_DIST / srcDist;
  const srcAngle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
  const targetAngle = Math.atan2(TARGET_RIGHT_EYE.y - TARGET_LEFT_EYE.y, TARGET_RIGHT_EYE.x - TARGET_LEFT_EYE.x);
  const rotate = targetAngle - srcAngle;

  const canvas = document.createElement('canvas');
  canvas.width = OUT_W;
  canvas.height = OUT_H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#efe6e0';
  ctx.fillRect(0, 0, OUT_W, OUT_H);

  const midTarget = {
    x: (TARGET_LEFT_EYE.x + TARGET_RIGHT_EYE.x) / 2,
    y: (TARGET_LEFT_EYE.y + TARGET_RIGHT_EYE.y) / 2,
  };
  const midSrc = { x: (leftEye.x + rightEye.x) / 2, y: (leftEye.y + rightEye.y) / 2 };

  ctx.save();
  ctx.translate(midTarget.x, midTarget.y);
  ctx.rotate(rotate);
  ctx.scale(scale, scale);
  ctx.translate(-midSrc.x, -midSrc.y);
  ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight);
  ctx.restore();

  return canvas;
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;

  alignedResults = [];
  const grid = document.getElementById('resultGrid');
  const statusLine = document.getElementById('statusLine');
  const actionRow = document.getElementById('actionRow');
  grid.innerHTML = '';
  document.getElementById('comparePreview').innerHTML = '';
  actionRow.style.display = 'none';
  statusLine.style.display = 'block';

  for (let i = 0; i < files.length; i++) {
    statusLine.textContent = `処理中... (${i + 1}/${files.length})`;
    const file = files[i];
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `<div style="aspect-ratio:3/4;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2);">検出中...</div><div class="cap">${file.name}</div>`;
    grid.appendChild(card);

    try {
      const img = await loadImageFile(file);
      const landmarks = await detectFace(img);
      if (!landmarks) {
        card.querySelector('div').textContent = '顔が見つかりませんでした';
        card.querySelector('.cap').classList.add('err');
        card.querySelector('.cap').textContent = file.name + '（スキップ）';
        continue;
      }
      const canvas = alignImage(img, landmarks);
      card.innerHTML = '';
      card.appendChild(canvas);
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = file.name;
      card.appendChild(cap);
      alignedResults.push({ canvas, name: file.name });
    } catch (err) {
      card.querySelector('.cap').classList.add('err');
      card.querySelector('.cap').textContent = file.name + '（処理失敗）';
    }
  }

  statusLine.style.display = 'none';
  if (alignedResults.length > 0) {
    actionRow.style.display = 'flex';
  }
});

// 1枚ずつ保存
document.getElementById('btnDownloadEach').addEventListener('click', () => {
  alignedResults.forEach((r, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.download = `aligned-${String(i + 1).padStart(2, '0')}.png`;
      a.href = r.canvas.toDataURL('image/png');
      a.click();
    }, i * 300); // 連続ダウンロードでブロックされないよう少しずつずらす
  });
});

// 並べた比較画像を作る
document.getElementById('btnMakeCompare').addEventListener('click', () => {
  const n = alignedResults.length;
  const cols = n <= 3 ? n : Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const gap = 8;
  const cw = OUT_W, ch = OUT_H;

  const canvas = document.createElement('canvas');
  canvas.width = cols * cw + (cols + 1) * gap;
  canvas.height = rows * ch + (rows + 1) * gap;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f7f4e9';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  alignedResults.forEach((r, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = gap + col * (cw + gap);
    const y = gap + row * (ch + gap);
    ctx.drawImage(r.canvas, x, y, cw, ch);
  });

  const preview = document.getElementById('comparePreview');
  preview.innerHTML = '';
  preview.appendChild(canvas);

  const dlBtn = document.createElement('button');
  dlBtn.className = 'action-btn primary';
  dlBtn.style.marginTop = '10px';
  dlBtn.style.width = '100%';
  dlBtn.textContent = '📥 この比較画像を保存';
  dlBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = `compare-${new Date().toISOString().slice(0, 10)}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
  preview.appendChild(dlBtn);
});
</script>
</body>
</html>
